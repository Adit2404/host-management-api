server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: host-management-api

logging:
  level:
    com.hostmanagement: INFO
    org.springframework: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false